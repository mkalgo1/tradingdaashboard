name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive with Xcode
        run: |
          cd ios/App
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into IPA
        run: |
          mkdir -p ios/App/build/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r TradeZella-Dashboard.ipa Payload
          echo "IPA generated successfully:"
          ls -lh TradeZella-Dashboard.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeZella-Dashboard-iOS-IPA
          path: ios/App/build/TradeZella-Dashboard.ipa
          retention-days: 30

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: ios/App/build/TradeZella-Dashboard.ipa
          tag_name: v2.4-ios
          name: TradeZella Dashboard iOS IPA (v2.4)
          body: |
            ### TradeZella Dashboard Native iOS App (.ipa)
            - Native iOS WKWebView wrapper with full hardware acceleration
            - Seamless touch gestures, native kinetic 120Hz scrolling
            - Real-time cloud sync to Supabase database
            - Install via Sideloadly, AltStore, TrollStore, or Xcode Configurator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
